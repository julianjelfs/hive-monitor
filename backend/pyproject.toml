[project]
name = "hive-monitor"
version = "0.1.0"
description = "Watches a Hive heating system and says when a link drops"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    # Hive's private API is unofficial; pin exactly so an upgrade is a deliberate act.
    "pyhive-integration==1.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
